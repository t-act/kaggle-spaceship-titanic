origin: claude
parent: exp001
hypothesis: "CV を test と同じくグループ単位で分割すると、グループ内の情報が検証側に漏れない分だけ CV が下がり、LB に近づく"
changes: "exp001 と同じモデルで、CV 分割を PassengerId のグループ単位（StratifiedGroupKFold）に変更"
model: LightGBM
tags: [baseline, lgbm, group-cv]

params:
  # notebook での試行結果（採用しなかった特徴量）
  # - FamilySize を追加: va 0.82 -> 0.81 に低下
  # - NoSpend, SpendCount を追加: va 変化なし、LB 0.806 -> 0.805 に低下
  # - VIP を除外: va 0.815 +- 0.004（採用版は 0.816 +- 0.005）
  features:
    - Age
    - TotalSpend
    - HomePlanet
    - CryoSleep
    - Destination
    - VIP
    - Deck
    - Num
    - Side
    - RoomService
    - FoodCourt
    - ShoppingMall
    - Spa
    - VRDeck
  # CryoSleep から支出と CryoSleep の欠損を論理的に埋める。oof 0.8159 -> 0.8148 に低下したため無効
  logical_imputation: false
  lgb:
    boosting_type: gbdt
    objective: binary
    metric: auc
    learning_rate: 0.1
    num_leaves: 16
    # 上限は大きく取り、実際の木の数は early stopping で決める
    n_estimators: 100000
    random_state: 123
    importance_type: gain
    verbose: -1
  early_stopping_rounds: 100
