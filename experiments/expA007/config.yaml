origin: claude
parent: expA006
hypothesis: "同行者は行動が似るため、グループの人数、グループ内の CryoSleep の割合と支出、同じ Cabin の人数を加えると CV が上がる"
changes: "GroupSize, GroupCryoRate, GroupSpend, GroupSpendOthers, CabinSize を追加"
model: LightGBM
tags: [lgbm, group-cv, honest-es, repeated-cv, group-features]

params:
  # notebook での試行結果（採用しなかった特徴量）
  # - FamilySize を追加: va 0.82 -> 0.81 に低下
  # - NoSpend, SpendCount を追加: va 変化なし、LB 0.806 -> 0.805 に低下
  # - VIP を除外: va 0.815 +- 0.004（採用版は 0.816 +- 0.005）
  features:
    - Age
    - TotalSpend
    - HomePlanet
    - CryoSleep
    - Destination
    - VIP
    - Deck
    - Num
    - Side
    - RoomService
    - FoodCourt
    - ShoppingMall
    - Spa
    - VRDeck
    - GroupSize
    - GroupCryoRate
    - GroupSpend
    - GroupSpendOthers
    - CabinSize
  # CryoSleep から支出と CryoSleep の欠損を論理的に埋める。oof 0.8159 -> 0.8148 に低下したため無効
  logical_imputation: false
  lgb:
    boosting_type: gbdt
    objective: binary
    metric: auc
    learning_rate: 0.1
    num_leaves: 16
    # 上限は大きく取り、実際の木の数は early stopping で決める
    n_estimators: 100000
    random_state: 123
    importance_type: gain
    verbose: -1
  early_stopping_rounds: 100
  # 学習側の 1/inner_splits を木の数を決めるための内側の検証に使う
  inner_splits: 5
  inner_seed: 0
