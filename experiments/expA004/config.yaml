origin: claude
parent: expA002
hypothesis: "検証 fold を early stopping と最良時点のモデル選択に使っているため OOF が楽観的になっている。検証 fold を見ずに木の数を決めると、CV は下がって LB（expA002 は 0.80827）に近づく"
changes: "学習側をさらにグループ単位で分けた内側の検証で木の数を決め、その木の数で学習側全体を学習し直す。検証 fold は予測にだけ使う"
model: CatBoost
tags: [catboost, seed-averaging, group-cv, honest-es]

params:
  features:
    - Age
    - TotalSpend
    - HomePlanet
    - CryoSleep
    - Destination
    - VIP
    - Deck
    - Num
    - Side
    - RoomService
    - FoodCourt
    - ShoppingMall
    - Spa
    - VRDeck
  logical_imputation: false
  # notebook では fold 分割の seed も 0/1/2 で変えていたが、CV を比較可能に保つため分割は固定し、モデルの seed だけを変える
  seeds: [0, 1, 2]
  # 学習側の 1/inner_splits を木の数を決めるための内側の検証に使う
  inner_splits: 5
  catboost:
    iterations: 10000
    learning_rate: 0.05
    eval_metric: AUC
    early_stopping_rounds: 200
    verbose: 0
