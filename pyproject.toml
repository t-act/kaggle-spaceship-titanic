[project]
name = "kaggle-spaceship-titanic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.9.1",
    "setuptools<81", # ydata-profiling が pkg_resources を import するため (81 で削除)
    "ydata-profiling>=4.18.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]

[tool.ruff]
line-length = 120
