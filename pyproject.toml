[project]
name = "kaggle-spaceship-titanic"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "jsonschema>=4.26.0",
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "setuptools<81", # ydata-profiling が pkg_resources を import するため (81 で削除)
    "ydata-profiling>=4.18.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# experiments/*/train.py から `import src` できるよう、src を editable インストールする
[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]

[tool.ruff]
line-length = 120
# 移行前の notebook は凍結した記録なので整形しない
extend-exclude = ["old_notebooks"]
